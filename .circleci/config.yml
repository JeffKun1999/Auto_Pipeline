# Usar la versión 2.1 del motor de pipelines de CircleCI
version: 2.1

# ---------------------------------------------------------------------
# EJECUTOR REUTILIZABLE
# ---------------------------------------------------------------------
executors:
  python-executor:
    docker:
      - image: cimg/python:3.10

# ---------------------------------------------------------------------
# JOBS
# ---------------------------------------------------------------------
jobs:
  build-test-notify:
    executor: python-executor
    
    steps:
      # Etapa 1: Checkout
      - checkout

      # Etapa 2: Construir Entorno
      - run:
          name: "Build Environment - Construir Entorno Virtual"
          command: |
            echo "--- Preparando Entorno de Python ---"
            python3 -m venv .venv
            source .venv/bin/activate
            echo "--- Instalando dependencias ---"
            pip install -r requirements.txt
            echo "--- Instalando cliente de email (yagmail) ---"
            pip install yagmail

      # Etapa 3: SAST (Safety)
      # Verifica vulnerabilidades conocidas en las dependencias
      - run:
          name: "Security Audit - SAST (Safety)"
          command: |
            echo "--- Ejecutando Safety Scan ---"
            source .venv/bin/activate
            echo "Analizando dependencias vulnerables en requirements-vulnerable.txt..."

            # Convertir CRLF a LF por si acaso
            dos2unix requirements-vulnerable.txt 2>/dev/null || sed -i 's/\r$//' requirements-vulnerable.txt

            # Usar el nuevo comando 'scan' en lugar de 'check' (deprecated)
            # --output text para formato legible en consola
            echo "Ejecutando: safety scan --file requirements-vulnerable.txt"
            safety scan --file requirements-vulnerable.txt || echo "✓ Safety encontró vulnerabilidades (esperado para demo)"

      # Etapa 4: Análisis de Calidad
      - run:
          name: "Code Quality -  Análisis de Calidad (Flake8)"
          command: |
            echo "--- Ejecutando Análisis de Calidad de Código con Flake8 ---"
            source .venv/bin/activate
            flake8 --output-file=flake8-report.txt --tee || echo "Flake8 encontró problemas" > flake8_failure.txt

      # Etapa 5: Pruebas Unitarias
      - run:
          name: "Unit Tests -  Ejecutar Pruebas Unitarias"
          command: |
            echo "--- Ejecutando Pruebas Unitarias con Pytest ---"
            source .venv/bin/activate
            pytest

      # Etapa 6: Desplegar y Ejecutar
      - run:
          name: "Deploy & Execute - Desplegar y Ejecutar"
          command: |
            echo "--- Desplegando la aplicación ---"


            if [ -f "deploy.sh" ]; then
              echo "Se encontró deploy.sh. Dando permisos de ejecución..."
              # Da permisos de ejecución al script de shell
              chmod +x deploy.sh
              # Ejecuta el script de shell
              ./deploy.sh
            else
              echo "Error: No se encontró 'deploy.sh'."
              echo "Por favor, crea 'deploy.sh' (la versión para Linux de 'deploy.bat')."
              exit 1
            fi
            # --- FIN DE LA CORRECCIÓN ---

            echo "--- Ejecutando Script de Comparación de PDFs ---"
            source .venv/bin/activate
            python compare_pdfs.py DocumentoA_1.pdf DocumentoA2.pdf
            python compare_pdfs.py DocumentoA_1.pdf DocumentoB1.pdf

      # Etapa 7: DAST (Wapiti)
      # IMPORTANTE: Levantamos la aplicación Flask vulnerable para escanearla
      - run:
          name: "Web Vulnerability Scan - DAST (Wapiti)"
          command: |
            echo "=========================================="
            echo "  INICIANDO ESCANEO DAST CON WAPITI"
            echo "=========================================="
            source .venv/bin/activate

            # Crear directorio para reportes
            echo "[1/6] Creando directorio de reportes..."
            mkdir -p reporte_seguridad
            pwd
            ls -la

            # Levantar la aplicación Flask en background
            echo "[2/6] Iniciando aplicación Flask en puerto 5000..."
            export FLASK_ENV=development
            nohup python app.py > flask.log 2>&1 &
            FLASK_PID=$!
            echo "Flask iniciado con PID: $FLASK_PID"

            # Esperar a que Flask esté listo
            echo "[3/6] Esperando a que Flask esté disponible..."
            FLASK_READY=false
            for i in {1..30}; do
              if curl -s -o /dev/null -w "%{http_code}" http://localhost:5000 | grep -q "200"; then
                echo "✓ Flask respondió exitosamente después de $i segundos"
                FLASK_READY=true
                break
              fi
              echo "  Intento $i/30: esperando..."
              sleep 1
            done

            if [ "$FLASK_READY" = false ]; then
              echo "❌ ERROR: Flask no respondió después de 30 segundos"
              echo "Logs de Flask:"
              cat flask.log || echo "No se pudo leer flask.log"
              kill $FLASK_PID 2>/dev/null || true
              echo "⚠ Continuando sin escaneo DAST..."
              exit 0
            fi

            # Probar endpoint de Flask
            echo "[4/6] Verificando endpoints de Flask..."
            curl -s http://localhost:5000 | head -n 5
            echo ""

            # Ejecutar Wapiti
            echo "[5/6] Ejecutando Wapiti..."

            # Wapiti 3.x requiere URL completa con barra final
            TARGET_URL="http://localhost:5000/"
            OUTPUT_FILE="reporte_seguridad/wapiti_report.html"

            echo "Target URL: $TARGET_URL"
            echo "Output: $OUTPUT_FILE"
            echo ""

            # Ejecutar Wapiti con sintaxis correcta para versión 3.x
            # -u URL (con barra al final)
            # -f formato (html, json, txt, xml)
            # -o archivo de salida
            echo "Ejecutando Wapiti..."
            wapiti -u "$TARGET_URL" -f html -o "$OUTPUT_FILE" 2>&1 | tee wapiti.log

            WAPITI_EXIT=$?
            echo "Wapiti terminó con código de salida: $WAPITI_EXIT"

            # Detener Flask
            echo "[6/6] Limpieza..."
            echo "Deteniendo Flask (PID: $FLASK_PID)..."
            kill $FLASK_PID 2>/dev/null || true
            sleep 2

            # Verificar resultados
            echo ""
            echo "=========================================="
            echo "  RESULTADOS DEL ESCANEO"
            echo "=========================================="
            echo "Contenido de reporte_seguridad/:"
            ls -lah reporte_seguridad/ || echo "Directorio no existe"

            if [ -f "reporte_seguridad/wapiti_report.html" ]; then
              FILE_SIZE=$(stat -f%z "reporte_seguridad/wapiti_report.html" 2>/dev/null || stat -c%s "reporte_seguridad/wapiti_report.html" 2>/dev/null || echo "?")
              echo "✓✓✓ ÉXITO: Reporte generado ✓✓✓"
              echo "  Archivo: reporte_seguridad/wapiti_report.html"
              echo "  Tamaño: $FILE_SIZE bytes"
              head -n 10 reporte_seguridad/wapiti_report.html
            else
              echo "❌ ERROR: No se generó reporte_seguridad/wapiti_report.html"
              echo "Archivos en directorio actual:"
              find . -name "*.html" -type f 2>/dev/null || true
            fi
            echo "=========================================="

      # Guardar reporte de Wapiti como artefacto
      - store_artifacts:
          path: reporte_seguridad/wapiti_report.html
          name: "Reporte Wapiti DAST"
          when: always

      # Guardar directorio completo de reportes
      - store_artifacts:
          path: reporte_seguridad/
          name: "Reportes de Seguridad Completos"
          when: always

      # Guardar logs para debugging
      - store_artifacts:
          path: flask.log
          name: "Flask Logs"
          when: always

      - store_artifacts:
          path: wapiti.log
          name: "Wapiti Logs"
          when: always

      # --- Pasos 'post' ---

      # Archivar Artefactos
      - store_artifacts:
          name: "Archivar reporte de Flake8"
          path: flake8-report.txt
          when: always

      # Notificación de Éxito / Inestable
      - run:
          name: "Notificación (Éxito / Inestable)"
          when: on_success
          command: |
            source .venv/bin/activate
            if [ -f "flake8_failure.txt" ]; then
              echo "Job exitoso, pero Flake8 falló. Enviando email 'UNSTABLE'."
              python send_mail.py unstable
            else
              echo "Job exitoso. Enviando email 'SUCCESS'."
              python send_mail.py success
            fi

      # Notificación de Fallo
      - run:
          name: "Notificación (Fallo)"
          when: on_fail
          command: |
            source .venv/bin/activate
            echo "Job fallido. Enviando email 'FAILURE'."
            python send_mail.py failure

# ---------------------------------------------------------------------
# WORKFLOWS
# ---------------------------------------------------------------------
workflows:
  main-workflow:
    jobs:
      - build-test-notify