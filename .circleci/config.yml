# Usar la versión 2.1 del motor de pipelines de CircleCI
version: 2.1

# ---------------------------------------------------------------------
# EJECUTOR REUTILIZABLE
# ---------------------------------------------------------------------
executors:
  python-executor:
    docker:
      - image: cimg/python:3.10

# ---------------------------------------------------------------------
# JOBS
# ---------------------------------------------------------------------
jobs:
  build-test-notify:
    executor: python-executor
    
    steps:
      # Etapa 1: Checkout
      - checkout

      # Etapa 2: Construir Entorno
      - run:
          name: "Build Environment - Construir Entorno Virtual"
          command: |
            echo "--- Preparando Entorno de Python ---"
            python3 -m venv .venv
            source .venv/bin/activate
            echo "--- Instalando dependencias ---"
            pip install -r requirements.txt
            echo "--- Instalando cliente de email (yagmail) ---"
            pip install yagmail

      # Etapa 3: SAST (Safety)
      # Verifica vulnerabilidades conocidas en las dependencias
      - run:
          name: "Security Audit - SAST (Safety)"
          command: |
            echo "--- Ejecutando Safety Check ---"
            source .venv/bin/activate
            echo "Analizando dependencias vulnerables en requirements-vulnerable.txt..."
            # Escanea el archivo con dependencias vulnerables intencionales
            safety check -r requirements-vulnerable.txt --full-report || echo "Safety encontró vulnerabilidades (esperado para demo)"

      # Etapa 4: Análisis de Calidad
      - run:
          name: "Code Quality -  Análisis de Calidad (Flake8)"
          command: |
            echo "--- Ejecutando Análisis de Calidad de Código con Flake8 ---"
            source .venv/bin/activate
            flake8 --output-file=flake8-report.txt --tee || echo "Flake8 encontró problemas" > flake8_failure.txt

      # Etapa 5: Pruebas Unitarias
      - run:
          name: "Unit Tests -  Ejecutar Pruebas Unitarias"
          command: |
            echo "--- Ejecutando Pruebas Unitarias con Pytest ---"
            source .venv/bin/activate
            pytest

      # Etapa 6: Desplegar y Ejecutar
      - run:
          name: "Deploy & Execute - Desplegar y Ejecutar"
          command: |
            echo "--- Desplegando la aplicación ---"


            if [ -f "deploy.sh" ]; then
              echo "Se encontró deploy.sh. Dando permisos de ejecución..."
              # Da permisos de ejecución al script de shell
              chmod +x deploy.sh
              # Ejecuta el script de shell
              ./deploy.sh
            else
              echo "Error: No se encontró 'deploy.sh'."
              echo "Por favor, crea 'deploy.sh' (la versión para Linux de 'deploy.bat')."
              exit 1
            fi
            # --- FIN DE LA CORRECCIÓN ---

            echo "--- Ejecutando Script de Comparación de PDFs ---"
            source .venv/bin/activate
            python compare_pdfs.py DocumentoA_1.pdf DocumentoA2.pdf
            python compare_pdfs.py DocumentoA_1.pdf DocumentoB1.pdf

      # Etapa 7: DAST (Wapiti)
      # IMPORTANTE: Wapiti necesita una aplicación WEB corriendo.
      # Se ejecuta después del deploy para escanear la aplicación en ejecución.
      - run:
          name: "Web Vulnerability Scan - DAST (Wapiti)"
          command: |
            echo "--- Ejecutando Wapiti ---"
            source .venv/bin/activate
            # -u define la URL objetivo. Reemplaza 'http://localhost:5000' con tu URL real.
            # --flush-session fuerza un nuevo escaneo.
            # -o guarda el reporte en el directorio reporte_seguridad.
            # ADVERTENCIA: Esto fallará si no hay nada corriendo en el puerto.
            # Para la demo, usamos 'true' al final para que no rompa el pipeline si falla la conexión.
            mkdir -p reporte_seguridad
            wapiti -u http://localhost:5000 -o reporte_seguridad/wapiti_report.html --flush-session || true

      # Guardar reporte de Wapiti como artefacto
      - store_artifacts:
          path: reporte_seguridad/wapiti_report.html
          name: "Reporte Wapiti DAST"

      # --- Pasos 'post' ---

      # Archivar Artefactos
      - store_artifacts:
          name: "Archivar reporte de Flake8"
          path: flake8-report.txt
          when: always

      # Notificación de Éxito / Inestable
      - run:
          name: "Notificación (Éxito / Inestable)"
          when: on_success
          command: |
            source .venv/bin/activate
            if [ -f "flake8_failure.txt" ]; then
              echo "Job exitoso, pero Flake8 falló. Enviando email 'UNSTABLE'."
              python send_mail.py unstable
            else
              echo "Job exitoso. Enviando email 'SUCCESS'."
              python send_mail.py success
            fi

      # Notificación de Fallo
      - run:
          name: "Notificación (Fallo)"
          when: on_fail
          command: |
            source .venv/bin/activate
            echo "Job fallido. Enviando email 'FAILURE'."
            python send_mail.py failure

# ---------------------------------------------------------------------
# WORKFLOWS
# ---------------------------------------------------------------------
workflows:
  main-workflow:
    jobs:
      - build-test-notify