# Pipeline CI/CD con CircleCI (CI) + ArgoCD (CD)
# CI: Build, Test, SAST, DAST, Push imagen Docker
# CD: ArgoCD sincroniza automaticamente con Kubernetes
version: 2.1

# ---------------------------------------------------------------------
# ORBS - Paquetes reutilizables de CircleCI
# ---------------------------------------------------------------------
orbs:
  docker: circleci/docker@2.4.0

# ---------------------------------------------------------------------
# EJECUTORES REUTILIZABLES
# ---------------------------------------------------------------------
executors:
  python-executor:
    docker:
      - image: cimg/python:3.10

# ---------------------------------------------------------------------
# JOBS
# ---------------------------------------------------------------------
jobs:
  # ===================================================================
  # JOB 1: CI - Test y Analisis de Seguridad
  # ===================================================================
  test-and-scan:
    executor: python-executor
    steps:
      - checkout

      # Construir Entorno
      - run:
          name: "Build Environment - Construir Entorno Virtual"
          command: |
            echo "--- Preparando Entorno de Python ---"
            python3 -m venv .venv
            source .venv/bin/activate
            echo "--- Instalando dependencias ---"
            pip install -r requirements.txt
            echo "--- Instalando cliente de email (yagmail) ---"
            pip install yagmail

      # SAST (Safety)
      - run:
          name: "Security Audit - SAST (Safety)"
          command: |
            echo "=========================================="
            echo "  ANALISIS SAST CON SAFETY"
            echo "=========================================="
            source .venv/bin/activate
            echo "Analizando dependencias vulnerables en requirements-vulnerable.txt..."
            dos2unix requirements-vulnerable.txt 2>/dev/null || sed -i 's/\r$//' requirements-vulnerable.txt
            mkdir -p reporte_seguridad

            if [ -z "$SAFETY_API_KEY" ]; then
              echo "Usando 'safety check' (modo legacy sin auth)..."
              safety check -r requirements-vulnerable.txt --json > reporte_seguridad/safety-report.json 2>&1 || true
              safety check -r requirements-vulnerable.txt --full-report > reporte_seguridad/safety-report.txt 2>&1 || true
            else
              echo "SAFETY_API_KEY encontrada, usando autenticacion"
              safety scan --key "$SAFETY_API_KEY" --file requirements-vulnerable.txt --output json > reporte_seguridad/safety-report.json 2>&1 || true
              safety scan --key "$SAFETY_API_KEY" --file requirements-vulnerable.txt --output text > reporte_seguridad/safety-report.txt 2>&1 || true
            fi

            echo "Reportes generados:"
            ls -lh reporte_seguridad/safety-report.* 2>/dev/null || echo "No se generaron reportes"
            echo "=========================================="

      - store_artifacts:
          path: reporte_seguridad/safety-report.json
          name: "Safety Report JSON"
          when: always

      - store_artifacts:
          path: reporte_seguridad/safety-report.txt
          name: "Safety Report TXT"
          when: always

      # Code Quality (Flake8)
      - run:
          name: "Code Quality - Analisis de Calidad (Flake8)"
          command: |
            echo "=========================================="
            echo "  ANALISIS DE CALIDAD CON FLAKE8"
            echo "=========================================="
            source .venv/bin/activate
            flake8 --output-file=flake8-report.txt --tee || echo "Flake8 encontro problemas" > flake8_failure.txt
            echo "=========================================="

      # Unit Tests
      - run:
          name: "Unit Tests - Ejecutar Pruebas Unitarias"
          command: |
            echo "--- Ejecutando Pruebas Unitarias con Pytest ---"
            source .venv/bin/activate
            pytest

      # Deploy local y ejecutar scripts
      - run:
          name: "Deploy & Execute - Desplegar y Ejecutar"
          command: |
            echo "--- Desplegando la aplicacion ---"
            if [ -f "deploy.sh" ]; then
              chmod +x deploy.sh
              ./deploy.sh
            fi
            echo "--- Ejecutando Script de Comparacion de PDFs ---"
            source .venv/bin/activate
            python compare_pdfs.py DocumentoA_1.pdf DocumentoA2.pdf
            python compare_pdfs.py DocumentoA_1.pdf DocumentoB1.pdf

      # DAST (Wapiti)
      - run:
          name: "Web Vulnerability Scan - DAST (Wapiti)"
          command: |
            echo "=========================================="
            echo "  INICIANDO ESCANEO DAST CON WAPITI"
            echo "=========================================="
            source .venv/bin/activate
            mkdir -p reporte_seguridad

            # Levantar Flask
            echo "Iniciando aplicacion Flask en puerto 5000..."
            export FLASK_ENV=development
            nohup python app.py > flask.log 2>&1 &
            FLASK_PID=$!

            # Esperar a que Flask este listo
            FLASK_READY=false
            for i in {1..30}; do
              if curl -s -o /dev/null -w "%{http_code}" http://localhost:5000 | grep -q "200"; then
                echo "Flask respondio exitosamente despues de $i segundos"
                FLASK_READY=true
                break
              fi
              sleep 1
            done

            if [ "$FLASK_READY" = false ]; then
              echo "ERROR: Flask no respondio"
              cat flask.log || true
              kill $FLASK_PID 2>/dev/null || true
              exit 0
            fi

            # Ejecutar Wapiti
            TARGET_URL="http://localhost:5000/"
            OUTPUT_FILE="reporte_seguridad/wapiti_report.html"
            wapiti -u "$TARGET_URL" -f html -o "$OUTPUT_FILE" 2>&1 | tee wapiti.log

            # Detener Flask
            kill $FLASK_PID 2>/dev/null || true

            echo "=========================================="
            ls -lah reporte_seguridad/ || echo "Directorio no existe"
            echo "=========================================="

      - store_artifacts:
          path: reporte_seguridad/wapiti_report.html
          name: "Reporte Wapiti DAST"
          when: always

      - store_artifacts:
          path: reporte_seguridad/
          name: "Reportes de Seguridad Completos"
          when: always

      - store_artifacts:
          path: flask.log
          name: "Flask Logs"
          when: always

      - store_artifacts:
          path: wapiti.log
          name: "Wapiti Logs"
          when: always

      - store_artifacts:
          path: flake8-report.txt
          name: "Archivar reporte de Flake8"
          when: always

      # Notificaciones
      - run:
          name: "Notificacion (Exito / Inestable)"
          when: on_success
          command: |
            source .venv/bin/activate
            if [ -f "flake8_failure.txt" ]; then
              echo "Job exitoso, pero Flake8 fallo. Enviando email 'UNSTABLE'."
              python send_mail.py unstable
            else
              echo "Job exitoso. Enviando email 'SUCCESS'."
              python send_mail.py success
            fi

      - run:
          name: "Notificacion (Fallo)"
          when: on_fail
          command: |
            source .venv/bin/activate
            echo "Job fallido. Enviando email 'FAILURE'."
            python send_mail.py failure

  # ===================================================================
  # JOB 2: CI - Build y Push de Imagen Docker
  # ===================================================================
  build-and-push-image:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true

      - run:
          name: "Build Docker Image"
          command: |
            echo "=========================================="
            echo "  CONSTRUYENDO IMAGEN DOCKER"
            echo "=========================================="
            # Construir imagen con tag del commit SHA
            docker build -t jeffdeck/pdf-compare-app:${CIRCLE_SHA1:0:7} .
            docker build -t jeffdeck/pdf-compare-app:latest .
            echo "Imagenes construidas:"
            docker images | grep pdf-compare-app
            echo "=========================================="

      - run:
          name: "Push Docker Image to Docker Hub"
          command: |
            echo "=========================================="
            echo "  PUBLICANDO IMAGEN A DOCKER HUB"
            echo "=========================================="
            # Login a Docker Hub
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

            # Push imagenes
            docker push jeffdeck/pdf-compare-app:${CIRCLE_SHA1:0:7}
            docker push jeffdeck/pdf-compare-app:latest

            echo "Imagenes publicadas:"
            echo "  - jeffdeck/pdf-compare-app:${CIRCLE_SHA1:0:7}"
            echo "  - jeffdeck/pdf-compare-app:latest"
            echo ""
            echo "ArgoCD detectara el cambio y sincronizara automaticamente"
            echo "=========================================="

# ---------------------------------------------------------------------
# WORKFLOWS
# ---------------------------------------------------------------------
workflows:
  # Pipeline CI/CD principal
  ci-cd-pipeline:
    jobs:
      # CI: Test y Analisis de Seguridad
      - test-and-scan:
          filters:
            branches:
              only:
                - ArgoCD
                - main

      # CI: Build y Push de imagen Docker (solo si test-and-scan pasa)
      - build-and-push-image:
          requires:
            - test-and-scan
          filters:
            branches:
              only:
                - ProyectoFinal
                - main
          context:
            - docker-hub-credentials
