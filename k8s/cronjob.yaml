apiVersion: batch/v1
kind: CronJob
metadata:
  name: pdf-comparison-job
  namespace: pdf-compare
  labels:
    app: pdf-compare
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: pdf-compare
            component: cronjob
        spec:
          containers:
          - name: pdf-comparator
            image: jeffdeck/pdf-compare-app:latest
            imagePullPolicy: Always
            command: ["python", "compare_pdfs.py", "DocumentoA_1.pdf", "DocumentoA2.pdf"]
            envFrom:
            - configMapRef:
                name: pdf-compare-config
            - secretRef:
                name: pdf-compare-secrets
            resources:
              requests:
                memory: "128Mi"
                cpu: "100m"
              limits:
                memory: "256Mi"
                cpu: "500m"
          restartPolicy: OnFailure
