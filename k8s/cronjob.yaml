apiVersion: batch/v1
kind: CronJob
metadata:
  name: pdf-comparison-job
  namespace: default
spec:
  schedule: "*/5 * * * *" # Ejecutar cada 5 minutos (para pruebas)
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: pdf-comparator
            image: tu_usuario_dockerhub/pdf-compare-app:latest # ¡CAMBIA ESTO!
            imagePullPolicy: Always
            command: ["python", "compare_pdfs.py", "DocumentoA_1.pdf", "DocumentoA2.pdf"]
            env:
            # Las credenciales deben venir de Secretos de K8s, pero para esta práctica:
            - name: LD_SDK_KEY
              value: "sdk-35c49438-74f2-4f95-be35-7f3a0722d3ae"
            - name: EMAIL_HOST_USER
              value: "tu_email@gmail.com"
            # Añade el resto de variables de entorno necesarias aquí
          restartPolicy: OnFailure